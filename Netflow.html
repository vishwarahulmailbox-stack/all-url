<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NetFlow — Video</title>
<style>
  :root{
    --bg: #FBF9F5;
    --panel: #FFFFFF;
    --panel-border: #E4E0D6;
    --ink: #1C1D1F;
    --ink-dim: #767268;
    --gold: #A97A38;
    --teal: #1E8C80;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; overflow:hidden;}
  body{
    background: var(--bg);
    color:var(--ink);
    font-family:'Salesforce Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    width:100vw; height:100vh;
    position:relative;
  }

  /* ---- ambient drifting light ---- */
  .ambient{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .ambient span{ position:absolute; border-radius:50%; filter:blur(70px); opacity:0.10; }
  .ambient span:nth-child(1){ width:460px; height:460px; background:var(--gold); top:-140px; left:-100px; animation: drift1 28s ease-in-out infinite; }
  .ambient span:nth-child(2){ width:420px; height:420px; background:var(--teal); bottom:-160px; right:-100px; animation: drift2 24s ease-in-out infinite; }
  @keyframes drift1{ 0%,100%{ transform:translate(0,0);} 50%{ transform:translate(70px,55px);} }
  @keyframes drift2{ 0%,100%{ transform:translate(0,0);} 50%{ transform:translate(-55px,-45px);} }

  /* ---- stage ---- */
  .player{ position:absolute; inset:0; z-index:1; display:flex; align-items:center; justify-content:center; }
  .stage{
    width:100%; max-width:900px; height:66vh; max-height:520px;
    position:relative;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    transition: opacity 0.4s ease;
  }
  .stage.out{ opacity:0; }

  .headline{
    font-family:'Salesforce Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; font-weight:500;
    font-size:clamp(26px, 4vw, 46px);
    text-align:center; color:var(--ink);
    margin-bottom:6px;
    opacity:0; transform:translateY(10px);
    animation: hlIn 0.7s cubic-bezier(.2,.7,.2,1) forwards;
    animation-delay:0.15s;
  }
  @keyframes hlIn{ to{ opacity:1; transform:translateY(0); } }

  .visualzone{ width:100%; height:320px; display:flex; align-items:center; justify-content:center; position:relative; }
  .visualzone svg{ width:100%; height:100%; overflow:visible; }

  .caption{
    margin-top:10px;
    font-size:clamp(13px, 1.4vw, 16px);
    color:var(--ink-dim);
    text-align:center; letter-spacing:0.01em; max-width:560px;
    opacity:0; transform:translateY(8px);
    animation: capIn 0.6s cubic-bezier(.2,.7,.2,1) forwards;
    animation-delay:0.5s;
  }
  @keyframes capIn{ to{ opacity:1; transform:translateY(0); } }
  .caption b{ color:var(--gold); font-weight:600; }

  .watermark{
    position:fixed; top:24px; left:28px; z-index:2;
    font-family:'Salesforce Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; font-size:13px; letter-spacing:0.05em;
    color:rgba(28,29,31,0.32);
  }
  .scenecount{
    position:fixed; top:24px; right:28px; z-index:2;
    font-size:12px; color:var(--ink-dim); font-variant-numeric:tabular-nums; letter-spacing:0.03em;
  }
  .scenecount b{ color:var(--gold); font-weight:600; }

  /* ---- bottom-right nav: two small circular icon buttons ---- */
  .chrome{
    position:fixed; right:20px; bottom:20px; z-index:5;
    display:flex; align-items:center; gap:8px;
  }
  .dots{ display:none; }

  button.navbtn{
    width:36px; height:36px; padding:0; border-radius:50%;
    border:1px solid var(--panel-border); background:var(--panel); color:var(--ink); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: border-color 0.2s, transform 0.15s, background 0.2s;
  }
  button.navbtn svg{ width:15px; height:15px; }
  button.navbtn:hover:not(:disabled){ border-color:var(--gold); transform:translateY(-1px); }
  button.navbtn:disabled{ opacity:0.3; cursor:default; }
  button.navbtn.primary{ background:var(--gold); color:#171308; border-color:var(--gold); }
  button.navbtn.primary:hover:not(:disabled){ background:#d9b678; }

  /* ===================== SCENE ANIMATIONS ===================== */
  .word-letter{ display:inline-block; opacity:0; transform:translateY(16px); animation: letterIn 0.6s cubic-bezier(.2,.7,.2,1) forwards; }
  @keyframes letterIn{ to{ opacity:1; transform:translateY(0); } }
  .title-line{ stroke:var(--gold); stroke-width:1.5; fill:none; opacity:0.5; stroke-dasharray:6 3; animation: dashMove 8s linear infinite; }
  @keyframes dashMove{ to{ stroke-dashoffset:-200; } }

  .seg-card{ opacity:0; transform:translateY(18px); animation: cardIn 0.55s cubic-bezier(.2,.7,.2,1) forwards; }
  @keyframes cardIn{ to{ opacity:1; transform:translateY(0); } }
  .seg-icon-circle{ animation: pulseRing 2.4s ease-in-out infinite; transform-origin:center; }
  @keyframes pulseRing{ 0%,100%{ opacity:0.3; } 50%{ opacity:0.75; } }

  .hub-line{ stroke:var(--panel-border); stroke-width:2; fill:none; stroke-dasharray:220; stroke-dashoffset:220; animation: drawLine 0.9s cubic-bezier(.3,.7,.3,1) forwards; }
  .hub-line.lit{ stroke:var(--gold); }
  @keyframes drawLine{ to{ stroke-dashoffset:0; } }
  .hub-center-circle{ opacity:0; transform:scale(0.6); transform-origin:center; animation: popIn 0.5s cubic-bezier(.3,.7,.3,1) forwards; }
  @keyframes popIn{ to{ opacity:1; transform:scale(1); } }
  .hub-node{ opacity:0; transform:scale(0.5); transform-origin:center; animation: nodeIn 0.5s cubic-bezier(.3,.7,.3,1) forwards; }
  @keyframes nodeIn{ to{ opacity:1; transform:scale(1); } }
  .hub-node.active circle.node-ring{ animation: activeGlow 1.8s ease-in-out infinite; transform-origin:center; }
  @keyframes activeGlow{ 0%,100%{ filter:drop-shadow(0 0 2px rgba(201,166,103,0.5)); } 50%{ filter:drop-shadow(0 0 12px rgba(201,166,103,0.95)); } }
  .hub-node-label{ opacity:0; animation: capIn 0.5s ease forwards; }

  .sf-core{ opacity:0; transform:scale(0.6); transform-origin:center; animation: popIn 0.5s cubic-bezier(.3,.7,.3,1) forwards; }
  .orbit-chip{ opacity:0; animation: chipIn 0.55s cubic-bezier(.2,.7,.2,1) forwards; }
  @keyframes chipIn{ from{ opacity:0; transform:translateY(10px) scale(0.85); } to{ opacity:1; transform:translateY(0) scale(1); } }
  .orbit-chip-inner{ animation: floaty 3.4s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
  @keyframes floaty{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-4px); } }

  .value-box{ opacity:0; transform:translateY(16px); animation: cardIn 0.55s cubic-bezier(.2,.7,.2,1) forwards; }
  .value-box-icon{ animation: pulseRing 2.6s ease-in-out infinite; transform-origin:center; }

  .assemble-letter{ opacity:0; animation: assembleIn 0.6s cubic-bezier(.2,.7,.2,1) forwards; }
  @keyframes assembleIn{ from{ opacity:0; transform:translateY(-14px) scale(0.9);} to{ opacity:1; transform:translateY(0) scale(1);} }
  .contact-ring{ stroke:var(--teal); stroke-width:1.5; fill:none; opacity:0; animation: ringPulse 0.8s ease forwards 0.6s; }
  @keyframes ringPulse{ from{ opacity:0; transform:scale(0.7); } to{ opacity:0.45; transform:scale(1); } }

  @media (max-width:640px){
    .stage{ height:56vh; }
    .visualzone{ height:220px; }
    .chrome{ right:14px; bottom:14px; }
  }
</style>
</head>
<body>

<div class="ambient"><span></span><span></span></div>
<div class="watermark">NetFlow</div>
<div class="scenecount"><b id="countNow">01</b> / <span id="countTotal">10</span></div>

<div class="player">
  <div class="stage" id="stage"></div>
</div>

<div class="chrome">
  <button class="navbtn" id="prevBtn" aria-label="Previous">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div class="dots" id="dots"></div>
  <button class="navbtn primary" id="nextBtn" aria-label="Next">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
  </button>
</div>

<script>
/* ---------- Scenes: short headline + caption + visual, no full slide text ---------- */
const HUB_NODES = [
  { id:"hni", label:"HNI", x:50 },
  { id:"institutional", label:"Institutional", x:150 },
  { id:"adviser", label:"Adviser", x:250 },
  { id:"privatecapital", label:"Private Capital", x:350 }
];

const scenes = [
  { headline:"", caption:"Built for <b>Wealth Management</b>", visual:"title" },
  { headline:"NetFlow target market", caption:"A combination some or all of the above which is very prevalent in the industry", visual:"market" },
  { headline:"What is NetFlow?", caption:"NetFlow is a composable suite of <b>relationship management solutions</b>", visual:"hub", activeBranch:null },
  { headline:"NetFlow HNI", caption:"Deep relationships, <b>personalised service</b>", visual:"hub", activeBranch:"hni" },
  { headline:"NetFlow Institutional", caption:"Win and manage <b>mandates</b>", visual:"hub", activeBranch:"institutional" },
  { headline:"NetFlow Adviser", caption:"Broaden your <b>distribution</b>", visual:"hub", activeBranch:"adviser" },
  { headline:"NetFlow Private Capital", caption:"System of record for <b>private markets</b>", visual:"hub", activeBranch:"privatecapital" },
  { headline:"NetFlow with Salesforce", caption:"NetFlow is built on <b>Salesforce platform</b>", visual:"platform" },
  { headline:"Value prop for Salesforce", caption:"Unlocks for <b>Salesforce</b> by NetFlow", visual:"valuegrid" },
  { headline:"gonetflow.com", caption:"Contact <b>Atlas Consulting</b> — atlasconsulting.com.au", visual:"contact" }
];

/* ---------- Visual builders ---------- */
function buildTitleVisual(){
  const letters = "NetFlow".split("").map((ch,i) => `<span class="word-letter" style="animation-delay:${0.05*i}s">${ch}</span>`).join("");
  return `
    <svg viewBox="0 0 700 220" style="position:absolute; inset:0;">
      <path class="title-line" d="M0,60 C120,20 200,100 320,60 C440,20 520,100 700,60"/>
      <path class="title-line" d="M0,160 C120,120 200,200 320,160 C440,120 520,200 700,160" style="animation-delay:-3s;opacity:0.3"/>
    </svg>
    <div style="position:relative; font-family:'Salesforce Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; font-size:64px; font-weight:600; color:var(--ink);">${letters}</div>`;
}

function buildMarketVisual(){
  const items = [
    { label:"High Networth Investors", icon:'<circle cx="0" cy="-3" r="6" fill="none" stroke="var(--gold)" stroke-width="1.6"/><circle cx="0" cy="7" r="9" fill="none" stroke="var(--gold)" stroke-width="1.6"/>' },
    { label:"Institutional investors", icon:'<rect x="-9" y="-2" width="4" height="14" fill="var(--gold)"/><rect x="-2" y="-8" width="4" height="20" fill="var(--gold)"/><rect x="5" y="2" width="4" height="10" fill="var(--gold)"/>' },
    { label:"Distributions", icon:'<circle cx="-8" cy="6" r="3" fill="var(--gold)"/><circle cx="8" cy="6" r="3" fill="var(--gold)"/><circle cx="0" cy="-6" r="3" fill="var(--gold)"/><line x1="-8" y1="6" x2="0" y2="-6" stroke="var(--gold)" stroke-width="1.4"/><line x1="8" y1="6" x2="0" y2="-6" stroke="var(--gold)" stroke-width="1.4"/>' },
    { label:"Private Credit / Equity", icon:'<rect x="-10" y="-9" width="20" height="18" rx="2" fill="none" stroke="var(--gold)" stroke-width="1.6"/><line x1="-6" y1="-3" x2="6" y2="-3" stroke="var(--gold)" stroke-width="1.4"/><line x1="-6" y1="2" x2="6" y2="2" stroke="var(--gold)" stroke-width="1.4"/>' }
  ];
  const cards = items.map((it,i) => `
    <div class="seg-card" style="animation-delay:${0.18*i}s; flex:1; display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center;">
      <svg width="72" height="72" viewBox="-26 -26 52 52">
        <circle class="seg-icon-circle" cx="0" cy="0" r="22" fill="none" stroke="var(--panel-border)" stroke-width="1.5"/>
        ${it.icon}
      </svg>
      <div style="font-size:13px; color:var(--ink-dim); line-height:1.3; max-width:130px;">${it.label}</div>
    </div>`).join("");
  return `<div style="display:flex; gap:22px; width:100%; height:100%; align-items:center; justify-content:center;">${cards}</div>`;
}

function buildHubVisual(activeBranch){
  const nodesSvg = HUB_NODES.map((n,i) => {
    const isActive = activeBranch === n.id;
    const dim = activeBranch && !isActive;
    const r = isActive ? 28 : 20;
    return `
      <path class="hub-line ${isActive ? 'lit' : ''}" d="M175,50 C ${n.x < 175 ? n.x+40 : n.x-40},50 ${n.x},80 ${n.x},130" style="animation-delay:${0.15*i}s" opacity="${dim ? 0.22 : 1}"/>
      <g class="hub-node ${isActive ? 'active' : ''}" style="animation-delay:${0.35 + 0.1*i}s; opacity:${dim ? 0.3 : 1}">
        <circle class="node-ring" cx="${n.x}" cy="150" r="${r}" fill="${isActive ? 'rgba(201,166,103,0.15)' : 'var(--panel)'}" stroke="${isActive ? 'var(--gold)' : 'var(--panel-border)'}" stroke-width="${isActive ? 2 : 1.5}"/>
      </g>
      <text class="hub-node-label" x="${n.x}" y="195" text-anchor="middle" style="animation-delay:${0.55 + 0.1*i}s; font-size:13px; font-family:'Salesforce Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; fill:${isActive ? 'var(--gold)' : 'var(--ink-dim)'}; font-weight:${isActive ? 600 : 400};">${n.label}</text>`;
  }).join("");

  return `
    <svg viewBox="0 0 400 210" style="max-width:520px;">
      ${nodesSvg}
      <g class="hub-center-circle">
        <circle cx="175" cy="50" r="32" fill="var(--panel)" stroke="var(--gold)" stroke-width="2"/>
        <text x="175" y="55" text-anchor="middle" style="font-family:'Salesforce Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; font-size:14px; fill:var(--ink); font-weight:600;">NetFlow</text>
      </g>
    </svg>`;
}

function buildPlatformVisual(){
  const chips = [
    { label:"Financial Services Cloud", angle:-140 },
    { label:"Sales Cloud", angle:-40 },
    { label:"Data Cloud", angle:40 },
    { label:"Agentforce", angle:140 }
  ];
  const R = 100;
  const chipEls = chips.map((c,i) => {
    const rad = c.angle * Math.PI / 180;
    const x = 200 + R * Math.cos(rad);
    const y = 105 + R * 0.55 * Math.sin(rad);
    return `
      <g class="orbit-chip" style="animation-delay:${0.5 + 0.12*i}s">
        <g class="orbit-chip-inner" style="animation-delay:${0.3*i}s">
          <rect x="${x-62}" y="${y-17}" width="124" height="34" rx="17" fill="var(--panel)" stroke="var(--panel-border)" stroke-width="1.3"/>
          <text x="${x}" y="${y+5}" text-anchor="middle" style="font-size:12px; font-family:'Salesforce Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; fill:var(--ink-dim);">${c.label}</text>
        </g>
      </g>`;
  }).join("");
  return `
    <svg viewBox="0 0 400 210" style="max-width:520px;">
      <circle cx="200" cy="105" r="38" class="sf-core" fill="rgba(95,199,189,0.12)" stroke="var(--teal)" stroke-width="2"/>
      <text x="200" y="100" text-anchor="middle" class="sf-core" style="font-family:'Salesforce Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; font-size:13px; fill:var(--ink); font-weight:600;">Salesforce</text>
      <text x="200" y="117" text-anchor="middle" class="sf-core" style="font-size:10px; font-family:'Salesforce Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; fill:var(--ink-dim);">platform</text>
      ${chipEls}
    </svg>`;
}

function buildValueGridVisual(){
  const values = [
    { t:"Reach under-served segments", icon:'<circle cx="0" cy="0" r="10" fill="none" stroke="var(--gold)" stroke-width="1.6"/><circle cx="0" cy="0" r="4" fill="var(--gold)"/>' },
    { t:"Create cross-sell & upsell opportunities", icon:'<path d="M-8,4 L0,-8 L8,4" fill="none" stroke="var(--gold)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>' },
    { t:"Re-engage with prospects", icon:'<path d="M-9,-6 A10,10 0 1 0 9,-6" fill="none" stroke="var(--gold)" stroke-width="1.8" stroke-linecap="round"/><polygon points="9,-11 9,-2 2,-6" fill="var(--gold)"/>' },
    { t:"Revive closed-lost opportunities", icon:'<path d="M-9,0 A9,9 0 1 1 0,9" fill="none" stroke="var(--gold)" stroke-width="1.8" stroke-linecap="round"/><polygon points="-9,-4 -9,4 -3,0" fill="var(--gold)"/>' }
  ];
  const boxes = values.map((v,i) => `
    <div class="value-box" style="animation-delay:${0.15*i}s; background:var(--panel); border:1px solid var(--panel-border); border-radius:14px; padding:20px 16px; display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center; width:160px;">
      <svg class="value-box-icon" width="28" height="28" viewBox="-12 -12 24 24">${v.icon}</svg>
      <div style="font-size:13px; color:var(--ink-dim); line-height:1.35;">${v.t}</div>
    </div>`).join("");
  return `<div style="display:flex; flex-wrap:wrap; gap:16px; width:100%; align-items:center; justify-content:center;">${boxes}</div>`;
}

function buildContactVisual(){
  const letters = "gonetflow.com".split("").map((ch,i) => `<span class="assemble-letter" style="animation-delay:${0.04*i}s">${ch}</span>`).join("");
  return `
    <svg viewBox="0 0 300 220" style="position:absolute; inset:0;">
      <circle class="contact-ring" cx="150" cy="100" r="75" style="transform-origin:150px 100px;"/>
      <circle class="contact-ring" cx="150" cy="100" r="102" style="animation-delay:0.9s; transform-origin:150px 100px;"/>
    </svg>
    <div style="position:relative; font-family:'Salesforce Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; font-size:38px; font-weight:600; color:var(--gold);">${letters}</div>`;
}

function buildVisual(s){
  let inner = "";
  if (s.visual === "title") inner = buildTitleVisual();
  else if (s.visual === "market") inner = buildMarketVisual();
  else if (s.visual === "hub") inner = buildHubVisual(s.activeBranch);
  else if (s.visual === "platform") inner = buildPlatformVisual();
  else if (s.visual === "valuegrid") inner = buildValueGridVisual();
  else if (s.visual === "contact") inner = buildContactVisual();
  return `<div class="visualzone">${inner}</div>`;
}

/* ---------- Render + manual navigation ---------- */
const stage = document.getElementById('stage');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const countNow = document.getElementById('countNow');
const countTotal = document.getElementById('countTotal');
const dotsWrap = document.getElementById('dots');

let current = 0;
countTotal.textContent = String(scenes.length).padStart(2, '0');
dotsWrap.innerHTML = scenes.map((_, i) => `<div class="dot" data-i="${i}"></div>`).join('');
const dotEls = [...dotsWrap.children];

function renderScene(s){
  stage.innerHTML = `
    <div class="headline">${s.headline}</div>
    ${buildVisual(s)}
    <div class="caption">${s.caption}</div>`;
}

function update(){
  renderScene(scenes[current]);
  countNow.textContent = String(current + 1).padStart(2, '0');
  prevBtn.disabled = current === 0;
  const restartIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>`;
  const nextIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>`;
  nextBtn.innerHTML = current === scenes.length - 1 ? restartIcon : nextIcon;
  nextBtn.setAttribute('aria-label', current === scenes.length - 1 ? 'Restart' : 'Next');
  dotEls.forEach((d, i) => d.classList.toggle('active', i === current));
}

function goTo(i){
  stage.classList.add('out');
  setTimeout(() => { current = i; update(); stage.classList.remove('out'); }, 300);
}

prevBtn.addEventListener('click', () => { if (current > 0) goTo(current - 1); });
nextBtn.addEventListener('click', () => {
  if (current === scenes.length - 1) goTo(0); else goTo(current + 1);
});
dotEls.forEach(d => d.addEventListener('click', () => goTo(parseInt(d.dataset.i))));
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') nextBtn.click();
  if (e.key === 'ArrowLeft') prevBtn.click();
});

update();
</script>
</body>
</html>
